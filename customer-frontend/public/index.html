<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FDFBF7" />

    <!-- Brand Favicons & Icons -->
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/pretty-glitz-logo.png" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/pretty-glitz-logo.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/pretty-glitz-logo.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Theme Preference Initialization (Prevent Flash of Unstyled Theme) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('pg-theme');
          if (saved === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>

    <!-- SEO Meta Tags -->
    <title>PrettyGlitz — Premium Bangles, Jewels & Accessories</title>
    <meta
      name="description"
      content="PrettyGlitz — Discover exquisite bangles, everlasting artificial flowers, premium jumkhas, and elegant jewels. Handcrafted accessories for your most precious moments."
    />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PrettyGlitz — Premium Bangles, Jewels & Accessories" />
    <meta property="og:description" content="Discover exquisite bangles, everlasting artificial flowers, premium jumkhas, and elegant jewels. Handcrafted accessories for your most precious moments." />
    <meta property="og:image" content="%PUBLIC_URL%/pretty-glitz-logo.png" />
    <meta property="og:url" content="https://pretty-glitz-z22x.vercel.app/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PrettyGlitz — Premium Bangles, Jewels & Accessories" />
    <meta name="twitter:description" content="Discover exquisite bangles, everlasting artificial flowers, premium jumkhas, and elegant jewels." />
    <meta name="twitter:image" content="%PUBLIC_URL%/pretty-glitz-logo.png" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
